<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gamestr Heatmap - 7 Day Activity</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #1a1a1a;
        color: #fff;
        padding: 20px;
        overflow: hidden;
      }

      h1 {
        text-align: center;
        margin-bottom: 20px;
        font-size: 24px;
      }

      #heatmap {
        display: grid;
        grid-template-columns: auto repeat(24, 1fr) auto;
        grid-template-rows: auto repeat(7, 1fr);
        gap: 2px;
        height: calc(100vh - 100px);
        width: 100%;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: bold;
        color: #999;
      }

      .day-label {
        padding-right: 10px;
        text-align: right;
        font-size: 14px;
        color: #999;
        display: flex;
        align-items: center;
        justify-content: flex-end;
      }

      .cell {
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .cell.current-hour-cell {
        background: rgba(54, 162, 235, 0.15);
        border: 2px solid #36A2EB;
        border-radius: 8px;
      }

      .bubble {
        border-radius: 50%;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 900;
        color: white;
        text-shadow: 0 0 3px rgba(0, 0, 0, 0.9);
      }

      @keyframes shimmer {
        0% {
          transform: scale(1);
          box-shadow: 0 0 0 rgba(255, 255, 255, 0);
        }
        50% {
          transform: scale(1.15);
          box-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
        }
        100% {
          transform: scale(1);
          box-shadow: 0 0 0 rgba(255, 255, 255, 0);
        }
      }

      .bubble.updated {
        animation: shimmer 0.8s ease-out;
      }

      .bubble.current-hour {
        border: 3px solid #36A2EB;
        box-shadow: 0 0 15px rgba(54, 162, 235, 0.6);
      }

      @keyframes pulse {
        0%, 100% {
          box-shadow: 0 0 15px rgba(54, 162, 235, 0.6);
        }
        50% {
          box-shadow: 0 0 25px rgba(54, 162, 235, 0.9);
        }
      }

      .bubble.current-hour {
        animation: pulse 2s ease-in-out infinite;
      }

      #status {
        text-align: center;
        font-size: 12px;
        color: #666;
        margin-top: 10px;
      }

      .daily-total {
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        color: #fff;
        font-weight: bold;
        padding-left: 10px;
      }

      .weekly-total {
        color: #36A2EB;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>Gamestr Activity Heatmap - Last 7 Days</h1>
    <div style="text-align: center; margin-bottom: 10px;">
      <a href="index.html" style="color: #36A2EB; text-decoration: none; font-size: 14px;">
        ← Back to Dashboard
      </a>
    </div>
    <div id="heatmap"></div>
    <div id="status">Connecting to Nostr...</div>

    <script>
      console.log('=== HEATMAP SCRIPT LOADED ===')
      const RELAY_URL = 'wss://nostr.rocks:4444/'
      const PUBKEY = '64401c0577261886bff71b49f22fb35225268f27313fb5af7d5eda7934574746'
      const MAX_POINTS = 200000
      const STORAGE_KEY = 'gamestr_hourly_data'

      // Data structure: { "YYYYMMDDHH": { work: 500, chores: 100, bots: 10 } }
      let hourlyData = {}
      let lastUpdatedHour = null
      const IMPORT_FLAG_KEY = 'gamestr_week_imported'

      // Load from localStorage
      function loadFromStorage() {
        const stored = localStorage.getItem(STORAGE_KEY)
        if (stored) {
          hourlyData = JSON.parse(stored)
          pruneOldData()
        }
      }

      // Save to localStorage
      function saveToStorage() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(hourlyData))
      }

      // Prune data older than 7 days
      function pruneOldData() {
        const now = new Date()
        const sevenDaysAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000)
        const cutoff = formatHourKey(sevenDaysAgo)

        for (const key in hourlyData) {
          if (key < cutoff) {
            delete hourlyData[key]
          }
        }
        saveToStorage()
      }

      // Import week.json data (one-time via ?import=1)
      async function importWeekData() {
        const urlParams = new URLSearchParams(window.location.search)
        const shouldImport = urlParams.get('import') === '1'
        const alreadyImported = localStorage.getItem(IMPORT_FLAG_KEY)

        if (shouldImport && !alreadyImported) {
          try {
            document.getElementById('status').textContent = 'Importing historical data...'
            const response = await fetch('week.json')
            if (!response.ok) {
              throw new Error('Failed to fetch week.json')
            }
            const weekData = await response.json()

            // Merge with existing data (weekData takes precedence)
            hourlyData = { ...hourlyData, ...weekData }

            saveToStorage()
            localStorage.setItem(IMPORT_FLAG_KEY, 'true')

            console.log(`Imported ${Object.keys(weekData).length} hours from week.json`)
            document.getElementById('status').textContent = `Imported ${Object.keys(weekData).length} hours of historical data`

            updateWeeklyTotal()
            renderHeatmap()
          } catch (err) {
            console.error('Error importing week data:', err)
            document.getElementById('status').textContent = 'Error importing data'
          }
        }
      }

      // Format date to YYYYMMDDHH
      function formatHourKey(date) {
        const y = date.getUTCFullYear()
        const m = String(date.getUTCMonth() + 1).padStart(2, '0')
        const d = String(date.getUTCDate()).padStart(2, '0')
        const h = String(date.getUTCHours()).padStart(2, '0')
        return `${y}${m}${d}${h}`
      }

      // Parse hour key to get day-of-week and hour
      function parseHourKey(key) {
        const y = parseInt(key.substring(0, 4))
        const m = parseInt(key.substring(4, 6)) - 1
        const d = parseInt(key.substring(6, 8))
        const h = parseInt(key.substring(8, 10))
        const date = new Date(Date.UTC(y, m, d, h))
        return {
          dayOfWeek: date.getUTCDay(), // 0=Sunday
          hour: h
        }
      }

      // Aggregate data for heatmap (7 days × 24 hours)
      function aggregateHeatmap() {
        const heatmap = Array(7).fill(0).map(() => Array(24).fill(0))

        for (const [key, categories] of Object.entries(hourlyData)) {
          const { dayOfWeek, hour } = parseHourKey(key)
          const total = Object.values(categories).reduce((sum, pts) => sum + pts, 0)
          heatmap[dayOfWeek][hour] += total
        }

        return heatmap
      }

      // Calculate bubble size (radius) based on points
      function getRadius(points, maxSize) {
        const ratio = Math.min(points / MAX_POINTS, 1)
        const minRadius = maxSize * 0.15
        const maxRadius = maxSize * 0.45
        return minRadius + ratio * (maxRadius - minRadius)
      }

      // Calculate color based on points (green → yellow → red)
      function getColor(points) {
        const ratio = Math.min(points / MAX_POINTS, 1)
        const hue = 120 - ratio * 120 // 120 (green) to 0 (red)
        return `hsl(${hue}, 70%, 50%)`
      }

      // Get gradient with depth for iPhone-like quality
      function getGradient(points) {
        const ratio = Math.min(points / MAX_POINTS, 1)
        const hue = 120 - ratio * 120
        // Radial gradient: lighter in center, darker at edges
        return `radial-gradient(circle at 35% 35%,
          hsl(${hue}, 70%, 65%) 0%,
          hsl(${hue}, 70%, 55%) 40%,
          hsl(${hue}, 70%, 45%) 100%)`
      }

      // Get layered shadows for depth
      function getBoxShadow(points) {
        if (points === 0) return 'none'
        const ratio = Math.min(points / MAX_POINTS, 1)
        const intensity = 0.3 + (ratio * 0.4)
        return `
          0 1px 2px rgba(0, 0, 0, ${intensity * 0.3}),
          0 2px 8px rgba(0, 0, 0, ${intensity * 0.2}),
          inset 0 1px 1px rgba(255, 255, 255, 0.3)
        `
      }

      // Render heatmap grid
      function renderHeatmap() {
        const container = document.getElementById('heatmap')
        container.innerHTML = ''

        const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']
        const heatmapData = aggregateHeatmap()

        // Get current hour (UTC)
        const now = new Date()
        const currentDay = now.getUTCDay()
        const currentHour = now.getUTCHours()

        // Get day/hour of last updated cell
        let updatedDay = null, updatedHour = null
        if (lastUpdatedHour) {
          const parsed = parseHourKey(lastUpdatedHour)
          updatedDay = parsed.dayOfWeek
          updatedHour = parsed.hour
        }

        // Top-left corner (empty)
        const corner = document.createElement('div')
        container.appendChild(corner)

        // Hour headers (0-23)
        for (let h = 0; h < 24; h++) {
          const header = document.createElement('div')
          header.className = 'header'
          header.textContent = String(h).padStart(2, '0')
          container.appendChild(header)
        }

        // Total header
        const totalHeader = document.createElement('div')
        totalHeader.className = 'header'
        totalHeader.textContent = 'Total'
        container.appendChild(totalHeader)

        // Day rows
        for (let day = 0; day < 7; day++) {
          // Day label
          const label = document.createElement('div')
          label.className = 'day-label'
          label.textContent = days[day]
          container.appendChild(label)

          // Hour cells
          let dayTotal = 0
          for (let hour = 0; hour < 24; hour++) {
            const cell = document.createElement('div')
            cell.className = 'cell'

            // Highlight current hour cell
            if (day === currentDay && hour === currentHour) {
              cell.classList.add('current-hour-cell')
            }

            const points = heatmapData[day][hour]
            dayTotal += points
            const cellRect = { width: window.innerWidth / 26, height: (window.innerHeight - 100) / 8 }
            const maxSize = Math.min(cellRect.width, cellRect.height)

            const bubble = document.createElement('div')
            bubble.className = 'bubble'
            const radius = getRadius(points, maxSize)
            bubble.style.width = `${radius * 2}px`
            bubble.style.height = `${radius * 2}px`

            // Apply gradient and layered shadows for depth
            if (points > 0) {
              bubble.style.background = getGradient(points)
              bubble.style.boxShadow = getBoxShadow(points)
            } else {
              bubble.style.backgroundColor = '#333'
            }

            bubble.title = `${days[day]} ${String(hour).padStart(2, '0')}:00 - ${points.toLocaleString()} pts`

            // Add text showing thousands of points
            if (points > 0) {
              const thousands = Math.round(points / 1000)
              bubble.textContent = thousands > 0 ? thousands : ''
            }

            // Add shimmer animation if this cell was just updated
            if (day === updatedDay && hour === updatedHour) {
              bubble.classList.add('updated')
              // Remove class after animation completes
              setTimeout(() => bubble.classList.remove('updated'), 800)
            }

            // Highlight current hour
            if (day === currentDay && hour === currentHour) {
              bubble.classList.add('current-hour')
            }

            cell.appendChild(bubble)
            container.appendChild(cell)
          }

          // Daily total
          const totalCell = document.createElement('div')
          totalCell.className = 'daily-total'
          totalCell.textContent = dayTotal.toLocaleString()
          container.appendChild(totalCell)
        }
      }

      // Update title with weekly total
      function updateWeeklyTotal() {
        const heatmapData = aggregateHeatmap()
        const weeklyTotal = heatmapData.reduce((sum, dayData) => {
          return sum + dayData.reduce((daySum, points) => daySum + points, 0)
        }, 0)

        const title = document.querySelector('h1')
        if (weeklyTotal > 0) {
          title.innerHTML = `Gamestr Activity Heatmap - Last 7 Days <span class="weekly-total">(${weeklyTotal.toLocaleString()} pts)</span>`
        } else {
          title.textContent = 'Gamestr Activity Heatmap - Last 7 Days'
        }
      }

      // Process Nostr event (same as index.html)
      function processEvent(event) {
        try {
          const timestamp = event.created_at * 1000
          const date = new Date(timestamp)
          const hourKey = formatHourKey(date)

          // Parse content - it's an object like { work: 500, chores: 100, bots: 55000 }
          const content = JSON.parse(event.content)

          console.log(`Received event for ${hourKey}:`, content)

          // Store complete hour data
          hourlyData[hourKey] = content
          lastUpdatedHour = hourKey

          saveToStorage()
          updateWeeklyTotal()
          renderHeatmap()
        } catch (err) {
          console.error('Error processing event:', err, event)
        }
      }

      // Connect to Nostr
      function connectNostr() {
        const ws = new WebSocket(RELAY_URL)

        ws.addEventListener('open', () => {
          console.log('Connected to Nostr relay')
          document.getElementById('status').textContent = 'Connected to Nostr'

          // Subscribe to kind 33334 events (same format as index.html)
          const req = `["REQ", "gamestr", {"kinds":[33334], "authors": ["${PUBKEY}"]}]`
          console.log('Sending REQ:', req)
          ws.send(req)
        })

        ws.addEventListener('message', (msg) => {
          try {
            const [type, subId, event] = JSON.parse(msg.data)
            if (type === 'EVENT' && event) {
              console.log('Received event:', event.created_at, event.content)
              processEvent(event)
            } else if (type === 'EOSE') {
              console.log('Initial sync complete, total events:', Object.keys(hourlyData).length)
              document.getElementById('status').textContent = `Live sync active (${Object.keys(hourlyData).length} hours loaded)`
            }
          } catch (err) {
            console.error('Error parsing message:', err)
          }
        })

        ws.addEventListener('error', (err) => {
          console.error('WebSocket error:', err)
          document.getElementById('status').textContent = 'Connection error'
        })

        ws.addEventListener('close', () => {
          console.log('Disconnected, reconnecting in 5s...')
          document.getElementById('status').textContent = 'Reconnecting...'
          setTimeout(connectNostr, 5000)
        })
      }

      // Initialize
      async function init() {
        loadFromStorage()
        await importWeekData()  // Import historical data if ?import=1
        updateWeeklyTotal()
        renderHeatmap()
        connectNostr()
      }

      init()

      // Re-render on window resize
      window.addEventListener('resize', () => {
        updateWeeklyTotal()
        renderHeatmap()
      })
    </script>
  </body>
</html>
